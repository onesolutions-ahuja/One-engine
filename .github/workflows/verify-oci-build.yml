name: Verify OCI production build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Page formulas and Smart Lookup regression tests
        run: node scripts/run-archived-tests.mjs apps/web/test/pageCompiler.test.ts
      - name: Compile server exactly as OCI
        run: npm run build --workspace apps/server
      - name: Compile frontend
        run: npm run build --workspace apps/web
