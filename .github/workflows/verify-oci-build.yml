name: Verify OCI production build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  native-storage-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metadrive_native_copy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Native storage copy unit tests
        run: node --import tsx --test apps/server/test/native-object-copy.test.mjs
      - name: Native storage copy PostgreSQL tests
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
        run: node --import tsx apps/server/scripts/native-object-copy-sql-smoke.mjs
      - name: Receipt settings, RBAC records, metadata seeds and Space Map
        env:
          EPOS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
        run: node --import tsx --test apps/server/test/eposPlatform.test.ts apps/web/test/spaceMap.test.mjs apps/web/test/tenantFormulaValues.test.ts
      - name: Core metadata version guard and Smart MultiPage
        run: node --import tsx --test apps/server/test/coreObjectsVersion.test.ts apps/web/test/smartMultiPage.test.mjs
      - name: MCP page component edits
        run: node --import tsx --test apps/server/test/mcpPageComponents.test.ts apps/server/test/autoNumberSearch.test.ts apps/web/test/sharedUiFixes.test.mjs
      - name: Native storage RecordEngine PostgreSQL tests
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
        run: node --import tsx apps/server/scripts/native-object-runtime-sql-smoke.mjs
      - name: Native unique fields and search index PostgreSQL tests
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
        run: node --import tsx apps/server/scripts/native-unique-search-smoke.mjs
      - name: System Objects and permanent Object delete (PostgreSQL)
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
        run: node --import tsx apps/server/scripts/object-purge-sql-smoke.mjs
      - name: Till tap SQL round trips (PostgreSQL)
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
          TRIPS_BUDGET: '34'
          TRIPS_BUDGET_PLAIN: '43'
        run: node --import tsx apps/server/scripts/record-trips-probe.mjs
      - name: Bulk saves, 100 records in one action (PostgreSQL)
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
          BULK_BUDGET_MS: '300'
        run: node --import tsx apps/server/scripts/bulk-save-sql-smoke.mjs
      - name: Shared payment order PostgreSQL tests
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
        run: node --import tsx apps/server/scripts/payment-order-sql-smoke.mjs
      - name: Product grid on 10k products (PostgreSQL)
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
          SEARCH_BUDGET_MS: '150'
        run: node --import tsx apps/server/scripts/search-10k-probe.mjs
      - name: Live changes, live for everything and page-open reads speed (PostgreSQL)
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metadrive_native_copy_test
          LIVE_BUDGET_MS: '100'
          LIVE_E2E_BUDGET_MS: '500'
          LIVE_SCREENS: '40'
          BATCH_BUDGET_MS: '250'
        run: node --import tsx apps/server/scripts/live-speed-probe.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Repository checks (same as the OCI deploy gate)
        run: npm run check
      - name: Page components and formula regression tests
        run: node scripts/check-test-components.mjs
      - name: Tenant onboarding backend regression tests
        run: npm run test:system --workspace apps/server
      - name: Page activation regression tests
        run: node --import tsx --test --test-name-pattern='Page Builder activat|publishing standalone Page Builder templates' apps/web/test/frontend.test.mjs apps/server/test/system/backend.test.mjs
      - name: Compile server exactly as OCI
        run: npm run build --workspace apps/server
      - name: Compile frontend
        run: npm run build --workspace apps/web
