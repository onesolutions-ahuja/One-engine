name: Verify OCI production build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Page components and formula regression tests
        run: node scripts/check-test-components.mjs
      - name: Page activation regression tests
        run: node --import tsx --test --test-name-pattern='Page Builder activat|publishing standalone Page Builder templates' apps/web/test/frontend.test.mjs apps/server/test/system/backend.test.mjs
      - name: Compile server exactly as OCI
        run: npm run build --workspace apps/server
      - name: Compile frontend
        run: npm run build --workspace apps/web
